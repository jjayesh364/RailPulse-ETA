services:
  # FastAPI backend + prebuilt SQLite/real-train catalog.
  # The database is generated during the Render build using the 8 GB
  # Starter build pipeline, then loaded by the 512 MB Free runtime.
  - type: web
    name: railpulse-eta-sih27-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: >-
      pip install -r backend/requirements.txt &&
      cd backend &&
      python -c "import asyncio; from app.database.db import init_db; from app.database.seed import seed_db; asyncio.run(init_db()); asyncio.run(seed_db())"
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./railpulse.db
      - key: DEMO_MODE
        value: "true"
      - key: SIMULATION_INTERVAL
        value: "3"

  # React/Vite frontend. VITE_API_URL is baked into the static build.
  - type: web
    runtime: static
    name: railpulse-eta-sih27-web
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://railpulse-eta-sih27-api.onrender.com/api
      - key: VITE_WS_URL
        value: wss://railpulse-eta-sih27-api.onrender.com/ws/live
